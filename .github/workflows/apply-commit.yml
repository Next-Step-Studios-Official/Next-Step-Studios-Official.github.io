name: Apply prepared commit

# The commit was prepared outside GitHub and cannot be pushed from there, so
# this fetches it as a bundle and merges it into main. Removed in the next
# commit.

on:
  push:
    paths:
      - .github/workflows/apply-commit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the prepared commit
        run: curl -fsSL --retry 3 -o "$RUNNER_TEMP/update.bundle" "https://nss-repository-transfer-h3jqwy-preview.freebuff.site/site-overhaul.bundle"

      - name: Merge it into main
        run: |
          set -euo pipefail
          git bundle verify "$RUNNER_TEMP/update.bundle"
          git fetch "$RUNNER_TEMP/update.bundle" "refs/heads/main:refs/remotes/import/main"
          git config user.name "Next Step Studios"
          git config user.email "nextstepstudiosofficial.contact@gmail.com"
          git checkout -B apply-main
          git merge --no-ff -m "Apply the prepared commit" refs/remotes/import/main
          git push origin apply-main:refs/heads/main
