name: Import prepared branch

# One-time import. The site overhaul was prepared away from GitHub and could
# not be pushed from there, so this fetches it as a bundle and merges it into
# main. It is deleted in the commit that follows.

on:
  push:
    paths:
      - .github/workflows/import-branch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the prepared branch
        run: curl -fsSL --retry 3 -o "$RUNNER_TEMP/site-overhaul.bundle" "https://nss-repository-transfer-h3jqwy-preview.freebuff.site/site-overhaul.bundle"

      - name: Merge it into main
        run: |
          set -euo pipefail
          git bundle verify "$RUNNER_TEMP/site-overhaul.bundle"
          git fetch "$RUNNER_TEMP/site-overhaul.bundle" "refs/heads/site-overhaul:refs/remotes/import/site-overhaul"
          git config user.name "Next Step Studios"
          git config user.email "nextstepstudiosofficial.contact@gmail.com"
          git checkout -B import-main
          git merge --no-ff -m "Import the prepared site overhaul" refs/remotes/import/site-overhaul
          git push origin import-main:refs/heads/main
