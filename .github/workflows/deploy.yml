name: Deploy to GitHub Pages

# Builds the static site and publishes it.
#
# The site's internal links are absolute ("/projects"), so it must be served
# from a domain root. That means this repository should be the organisation
# site repository: <org>.github.io. If it is not, enable Pages with a custom
# domain or move the site to the org site repository.

on:
  push:
    branches: [main]
    # The bot updates the status feed every five minutes. The page reads the
    # raw file from GitHub, so a status-only commit needs no rebuild.
    paths-ignore:
      - public/status.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on for a new repository. If the token lacks admin
          # rights this step fails; enable Pages once in Settings → Pages
          # with "GitHub Actions" as the source, then re-run the workflow.
          enablement: true

      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: /
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # Optional, no bot code: post the live URL to a Discord channel webhook.
      # Add DISCORD_WEBHOOK_URL under Settings → Secrets and variables →
      # Actions → Secrets. While it is empty this step prints and exits green.
      - name: Announce in Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not set; skipping the announcement."
            exit 0
          fi
          node --input-type=module -e '
            const message = [
              "**Next Step Studios — site deployed**",
              `Live: ${{ steps.deployment.outputs.page_url }}`,
              `Commit: ${process.env.GITHUB_SHA.slice(0, 7)}`,
              `Run: https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            ].join("\n");
            const response = await fetch(process.env.DISCORD_WEBHOOK_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ content: message }),
            });
            if (!response.ok) {
              console.error("Discord webhook failed", response.status, await response.text());
              process.exit(1);
            }
          '
